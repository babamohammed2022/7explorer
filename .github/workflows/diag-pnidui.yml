# Diagnostic only: does the 22621 pnidui.dll load on the runner's Windows?
name: diag-pnidui
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/diag-pnidui.yml", "tools/pnidui_probe.py", "tools/sso_probe.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          pip install pefile | Out-Null
          [System.Environment]::OSVersion.Version | Out-String | Add-Content ci-logs\pnidui.txt
          curl.exe -sS -L -w "HTTP %{http_code}`n" -o pnidui.dll "https://msdl.microsoft.com/download/symbols/pnidui.dll/F717CABC20B000/pnidui.dll" *>> ci-logs\pnidui.txt
          curl.exe -sS -L -o en.mui "https://raw.githubusercontent.com/valinet/ExplorerPatcher/0a88a6e0ef6b1752fea36e581cffff1097e862b0/ep_setup/resources/files/pnidui/en-US/pnidui.dll.mui"
          python tools\pnidui_probe.py pnidui.dll en.mui *>> ci-logs\pnidui.txt
          $j = Start-Job { param($d) Set-Location $d; python tools\sso_probe.py pnidui.dll 2>&1 } -ArgumentList (Get-Location).Path
          if (Wait-Job $j -Timeout 60) { Receive-Job $j *>> ci-logs\pnidui.txt } else { "sso probe timeout" | Add-Content ci-logs\pnidui.txt; Receive-Job $j *>> ci-logs\pnidui.txt }
          reg query "HKCR\CLSID\{C2796011-81BA-4148-8FCA-C6643245113F}" /s *>> ci-logs\pnidui.txt
          Get-AuthenticodeSignature pnidui.dll | Format-List * | Out-String | Add-Content ci-logs\pnidui.txt
      - name: Commit report
        if: always()
        shell: pwsh
        run: |
          git config user.email "ci@localhost"; git config user.name "ci-log-bot"
          $br = "ci-logs/pnidui-" + $env:GITHUB_RUN_ID
          git checkout -b $br
          git add -f ci-logs
          git commit -m "pnidui diag $env:GITHUB_RUN_ID"
          git push -f origin $br
