name: diag-localize-repro
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diag-localize.yml
jobs:
  repro:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64
      - shell: cmd
        run: mkdir repro-ci || echo exists
      - name: Build installer (catalog embed + msbuild)
        shell: cmd
        run: |
          python tools\embed_catalog.py
          msbuild installer\ex7selfcontained\ex7selfcontained.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m > repro-ci\msbuild-diag.log 2>&1
          if errorlevel 1 exit /b 1
      - name: Reproduce localization failure against reference exe
        shell: cmd
        run: |
          cd repro-ci
          copy /Y ..\installer\ex7selfcontained\bin\ex7selfcontained.exe .
          ex7selfcontained.exe > run1.out 2>&1
          echo exit=%ERRORLEVEL% > run-exit.txt
          exit /b 0
      - name: Collect repro logs
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@localhost"
          git config user.name "ci-log-bot"
          $br = "ci-logs/diagloc-" + $env:GITHUB_RUN_ID
          Get-ChildItem -Recurse repro-ci | Out-Default
          Get-ChildItem -Recurse -File repro-ci -Include *.out,*.log,*.txt | ForEach-Object { Copy-Item $_.FullName -Destination repro-ci\$($_.Name) -Force }
          if (Test-Path repro-ci\log) { Get-ChildItem repro-ci\log | ForEach-Object { Copy-Item $_.FullName -Destination repro-ci\ } }
          git checkout -b $br 2>$null
          Get-ChildItem -Recurse -File repro-ci | Where-Object { $_.Extension -in '.out','.log','.txt' } | ForEach-Object {
            $dest = "repro-ci-upload/" + $_.Name
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item $_.FullName $dest
          }
          git add -f repro-ci-upload
          git commit -m "localize repro logs for run $env:GITHUB_RUN_ID"
          git push -f origin $br
