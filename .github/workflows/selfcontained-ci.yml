name: selfcontained-ci

# CI del bootstrap self-contained:
#  - test Python (patcher/analyzer/verifier) sempre;
#  - build MSVC di wrp64.dll (con MinHook clonato, come da README) e di
#    ex7selfcontained.exe;
#  - verifica SUL FILE REALE scaricato dai server Microsoft: hash, header,
#    patch Python vs C++ byte-per-byte, import risultanti verso wrp64.dll;
#  - su tag "v*-test*": pre-release con gli eseguibili compilati QUI.
#  Nessun binario Microsoft viene caricato negli artifact o nella release.
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*-test*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # serve al job prerelease (GITHUB_TOKEN del fork)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Python test suite (patcher / analyzer / catalog verifier)
        run: python tests/run_tests.py

      - name: Catalog verify + deterministic generation (twice, diff-exit)
        shell: cmd
        run: |
          python tools\embed_catalog.py
          python tools\embed_catalog.py
          git diff --exit-code -- explorerwrapper/ex7_languages.rc installer/ex7selfcontained/lang_catalog.h

      - name: Clone and build MinHook (libMinHook.x64.lib, non committata)
        shell: cmd
        run: |
          git clone https://github.com/TsudaKageyu/minhook.git minhook
          cd minhook\build\VC17
          msbuild MinHookVC17.sln /p:Configuration=Release /p:Platform=x64 /m /v:m /flp:LogFile=..\..\..\msbuild-minhook.log
          copy /Y .\lib\Release\libMinHook.x64.lib ..\..\..\explorerwrapper\

      - name: Build wrp64.dll (Release x64)
        shell: cmd
        run: msbuild explorerwrapper.sln /p:Configuration=Release /p:Platform=x64 /m /v:m /flp:v=m;LogFile=msbuild-wrp64.log

      - name: Build ex7selfcontained.exe (Release x64)
        shell: cmd
        run: msbuild installer\ex7selfcontained\ex7selfcontained.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /flp:v=m;LogFile=msbuild-ex7selfcontained.log

      - name: Download reference explorer.exe and re-verify pinned identity
        shell: cmd
        run: |
          mkdir work
          echo --- download --- > ci-logs\run-verify.txt
          curl.exe -L -o work\explorer-ref.exe "https://msdl.microsoft.com/download/symbols/explorer.exe/4CE7A1442C0000/explorer.exe" 2>> ci-logs\run-verify.txt
          if errorlevel 1 exit /b 1

      - name: Re-verify hash (allow-list), size and signature
        shell: pwsh
        run: |
          $expected = @(
            '5769e5b25c7bfbc20dbfdca2f17b751f6d968e03412705de4a16c99b2626e21b',
            '6a671b92a69755de6fd063fcbe4ba926d83b49f78c42dbaeed8cdb6bbc57576a')
          $h = (Get-FileHash -Algorithm SHA256 work\explorer-ref.exe).Hash.ToLower()
          $s = (Get-Item work\explorer-ref.exe).Length
          "--- hash+size ---"     | Add-Content ci-logs\run-verify.txt
          "sha256: $h"            | Add-Content ci-logs\run-verify.txt
          "size: $s"              | Add-Content ci-logs\run-verify.txt
          if (-not ($expected -contains $h)) { throw "SHA256 NOT IN ALLOW-LIST: $h" }
          if ($s -ne 2872320) { throw "SIZE MISMATCH: $s" }
          $sig = Get-AuthenticodeSignature work\explorer-ref.exe
          "signature: $($sig.Status) | $($sig.SignerCertificate.Subject)" | Add-Content ci-logs\run-verify.txt
          # NotSigned is EXPECTED for symbol-server copies of Win7 binaries
          # (they are catalog-signed at OS level, not embedded); log it.
          if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'NotSigned') { throw "UNEXPECTED SIGNATURE STATUS: $($sig.Status)" }

      - name: Dump PE headers of the reference (log evidence)
        shell: cmd
        run: |
          echo --- pe headers --- >> ci-logs\run-verify.txt
          python tools\analyze_mui.py work\explorer-ref.exe --dump-headers >> ci-logs\run-verify.txt 2>&1
          if errorlevel 1 exit /b 1

      - name: Patch imports on the REAL file with the Python reference
        run: python tools\patch_imports.py work\explorer-ref.exe work\explorer-py.exe

      - name: Patch imports with the C++ build and compare byte-for-byte
        shell: cmd
        run: |
          installer\ex7selfcontained\bin\ex7selfcontained.exe --selftest-importpatch work\explorer-ref.exe > ci-logs\selftest.txt 2>&1
          if errorlevel 1 exit /b 1
          fc /b work\explorer-ref.exe.ex7patched work\explorer-py.exe >> ci-logs\selftest.txt 2>&1
          if errorlevel 1 exit /b 1

      - name: Verify the patched imports resolve to wrp64.dll
        shell: cmd
        run: python tools\analyze_mui.py work\explorer-ref.exe.ex7patched --dump-headers | findstr /i "wrp64.dll"

      - name: Inspect the C++-patched imports once more (log evidence)
        run: python tools\analyze_mui.py work\explorer-ref.exe.ex7patched --dump-headers

      # ---- v0.0.3: generated-resource pipeline, END-TO-END on real Windows
      - name: E2E run: installer download->patch->localize (no .mui anywhere)
        shell: cmd
        run: |
          mkdir e2e
          copy /Y installer\ex7selfcontained\bin\ex7selfcontained.exe e2e\
          cd e2e
          ex7selfcontained.exe > run.out 2>&1
          if errorlevel 1 (type run.out & exit /b 1)
          type run.out
      - name: E2E proof: generated resources verified in the REAL PE
        shell: cmd
        run: |
          python tools\check_pe_resources.py e2e\explorer.exe ^
            > ci-logs\check-pe-resources.txt 2>&1
          if errorlevel 1 (type ci-logs\check-pe-resources.txt & exit /b 1)
          type ci-logs\check-pe-resources.txt
      - name: E2E rerun: idempotency (second run rewrites identically)
        shell: cmd
        run: |
          cd e2e
          ex7selfcontained.exe --offline > run2.out 2>&1
          if errorlevel 1 (type run2.out & exit /b 1)
          cd ..
          python tools\check_pe_resources.py e2e\explorer.exe
          if errorlevel 1 exit /b 1

      - name: Produce SHA256SUMS for the CI-built binaries
        shell: pwsh
        run: |
          $items = @("Release\wrp64.dll", "installer\ex7selfcontained\bin\ex7selfcontained.exe")
          $lines = foreach ($i in $items) { $h=(Get-FileHash -Algorithm SHA256 $i).Hash.ToLower(); "$h  $(Split-Path $i -Leaf)" }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Commit build logs on failure (readable from the dev sandbox)
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@localhost"
          git config user.name "ci-log-bot"
          $br = "ci-logs/sc-" + $env:GITHUB_RUN_ID
          Get-ChildItem msbuild-*.log -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ("ci-logs\" + $_.BaseName + ".txt") -Force }
          git checkout -b $br 2>$null
          git add -f ci-logs
          git commit -m "build logs for run $env:GITHUB_RUN_ID" -m "(auto)"
          git push -f origin $br

      - name: Upload artifacts (NO Microsoft binaries)
        if: always()  # anche in caso di fallimento: servono i log di build
        uses: actions/upload-artifact@v4
        with:
          name: ex7selfcontained-binaries
          path: |
            Release/wrp64.dll
            installer/ex7selfcontained/bin/ex7selfcontained.exe
            SHA256SUMS.txt
            msbuild-wrp64.log
            msbuild-ex7selfcontained.log
            msbuild-minhook.log
          retention-days: 30

  prerelease:
    needs: build
    runs-on: windows-latest
    # solo sui tag di test, mai sulle branch
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-test')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ex7selfcontained-binaries
      - name: Publish pre-release with CI-built binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File | Select-Object -ExpandProperty FullName |
            Out-File ci-logs\release.txt -Append
          gh release create "$env:TAG" --prerelease `
            --title "ex7 self-contained bootstrap - test $env:TAG" `
            --notes-file docs/RELEASE_NOTES_test.md `
            "Release/wrp64.dll#wrp64.dll" `
            "installer/ex7selfcontained/bin/ex7selfcontained.exe#ex7selfcontained.exe" `
            "SHA256SUMS.txt" *>&1 |
            Out-File ci-logs\release.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "release create failed" }
          gh release view "$env:TAG" *>&1 | Out-File ci-logs\release.txt -Append

      - name: Commit release logs on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@localhost"
          git config user.name "ci-log-bot"
          $br = "ci-logs/rel-" + $env:GITHUB_RUN_ID
          git checkout -b $br 2>$null
          git add -f ci-logs
          git commit -m "release logs for run $env:GITHUB_RUN_ID" -m "(auto)"
          git push -f origin $br
