# Diagnostic only: strings/imports of the tray DLLs on the runner's Windows.
name: diag-tray
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/diag-tray.yml", "tools/tray_strings.py"]
  workflow_dispatch:
permissions:
  contents: read  # log upload only, no branch commits
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dump
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          pip install pefile | Out-Null
          [System.Environment]::OSVersion.Version | Out-String | Add-Content ci-logs\tray.txt
          $f = "sndvolsso.dll","pnidui.dll","stobject.dll","SndVol.exe","netshell.dll" | % { "C:\Windows\System32\$_" } | ? { Test-Path $_ }
          python tools\tray_strings.py @f *>> ci-logs\tray.txt
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ShellServiceObjects" /s *>> ci-logs\tray.txt
          reg query "HKLM\SOFTWARE\Classes\CLSID\{7007ACCF-3202-11D1-AAD2-00805FC1270E}" /s *>> ci-logs\tray.txt
      - name: Upload diag logs as artifact (no branch commits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-tray-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
